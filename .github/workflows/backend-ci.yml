name: Backend CI

on:
  pull_request:
    branches:
      - main
      - backend-main
    paths:
      - 'web/backend/**'

jobs:
  backend-ci:
    name: Lint, Build & Test (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
